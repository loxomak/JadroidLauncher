name: Android release

# Builds the app and attaches the APK to the GitHub release.
#
# * pushing a tag such as v1.0.1  -> builds and uploads the APK to that tag's release
# * manual run (workflow_dispatch) -> builds and keeps the APK as a workflow artifact
#
# Signing: set the following repository secrets to sign with your own keystore. When they are
# absent the release APK is signed with the CI debug key, which is fine for testing builds but
# should not be used for a real store release.
#   JADROID_KEYSTORE_BASE64      base64 of your .jks  (`base64 -w0 jadroid-release.jks`)
#   JADROID_KEYSTORE_PASSWORD
#   JADROID_KEY_ALIAS
#   JADROID_KEY_PASSWORD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}

      - name: Decode signing keystore
        if: ${{ secrets.JADROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.JADROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/jadroid-release.jks"
          echo "JADROID_KEYSTORE_PATH=$RUNNER_TEMP/jadroid-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          JADROID_KEYSTORE_PASSWORD: ${{ secrets.JADROID_KEYSTORE_PASSWORD }}
          JADROID_KEY_ALIAS: ${{ secrets.JADROID_KEY_ALIAS }}
          JADROID_KEY_PASSWORD: ${{ secrets.JADROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect and checksum the APK
        id: apk
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="0.0.0-run${GITHUB_RUN_NUMBER}"
          fi
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/jadroid-${VERSION}.apk"
          sha1sum "out/jadroid-${VERSION}.apk" | tee "out/jadroid-${VERSION}.apk.sha1"
          echo "file=out/jadroid-${VERSION}.apk" >> "$GITHUB_OUTPUT"
          echo "sha1=$(cut -d' ' -f1 "out/jadroid-${VERSION}.apk.sha1")" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jadroid-apk
          path: out/*
          if-no-files-found: error

      - name: Attach APK to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          fail_on_unmatched_files: true
          # Appended rather than replaced so hand written release notes are preserved.
          append_body: true
          body: |
            ---
            Build for tag `${{ github.ref_name }}` from `${{ github.sha }}`:

            | File | SHA-1 |
            | --- | --- |
            | `jadroid-${{ github.ref_name }}.apk` | `${{ steps.apk.outputs.sha1 }}` |

            A Java runtime still has to be imported in Settings before the first launch (see README).
