org.gradle.jvmargs=-Xmx1792m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=false

# Compile Kotlin inside the Gradle daemon. Containers with tight memory limits frequently see the
# separate Kotlin compile daemon die on startup ("The daemon has terminated unexpectedly"), which
# makes builds flaky; in-process compilation needs one JVM less and is deterministic.
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

kotlin.code.style=official
